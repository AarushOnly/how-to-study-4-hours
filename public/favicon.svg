<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark Rounded Squircle Background -->
  <rect width="64" height="64" rx="16" fill="#090E1A" stroke="#F59E0B" stroke-width="2" />
  
  <!-- Subtle Internal Radial Glow -->
  <circle cx="32" cy="30" r="22" fill="#F59E0B" fill-opacity="0.12" />

  <!-- Luminous Open Book Emblem -->
  <g transform="translate(14, 16)">
    <!-- Book Spine Glow -->
    <path d="M18 4 C18 18 18 28 18 30" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Left Page -->
    <path d="M18 6 C12 3 5 3 2 4 C1 4.5 1 5.5 1 6.5 L1 26 C4 25 11 25 18 28 Z" 
          fill="url(#goldGrad)" 
          stroke="#F59E0B" 
          stroke-width="1.5" 
          stroke-linejoin="round" />
          
    <!-- Right Page -->
    <path d="M18 6 C24 3 31 3 34 4 C35 4.5 35 5.5 35 6.5 L35 26 C32 25 25 25 18 28 Z" 
          fill="url(#goldGradLight)" 
          stroke="#F59E0B" 
          stroke-width="1.5" 
          stroke-linejoin="round" />

    <!-- Left Page Lines -->
    <line x1="6" y1="10" x2="14" y2="10" stroke="#090E1A" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.6"/>
    <line x1="6" y1="15" x2="14" y2="15" stroke="#090E1A" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.6"/>
    <line x1="6" y1="20" x2="13" y2="20" stroke="#090E1A" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.6"/>

    <!-- Right Page Lines -->
    <line x1="22" y1="10" x2="30" y2="10" stroke="#090E1A" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.6"/>
    <line x1="22" y1="15" x2="30" y2="15" stroke="#090E1A" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.6"/>
    <line x1="22" y1="20" x2="29" y2="20" stroke="#090E1A" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.6"/>

    <!-- Focus Star / Spark on Top -->
    <path d="M18 -4 L19.2 -1 L22 0 L19.2 1 L18 4 L16.8 1 L14 0 L16.8 -1 Z" fill="#38BDF8" />
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="18" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="goldGradLight" x1="18" y1="0" x2="35" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
</svg>